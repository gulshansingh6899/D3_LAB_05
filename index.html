<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3.js Lab 5 — Force-Directed Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f7f8fb;color:#172033}header{padding:1.25rem 5vw;background:#172033;color:white}nav a{color:#b9dcff;margin-right:1rem}main{max-width:1100px;margin:1.5rem auto;padding:0 1rem}.panel{background:white;border:1px solid #dbe2ea;border-radius:12px;padding:1rem;box-shadow:0 4px 16px #18243a0a}svg{width:100%;height:580px}.link{stroke:#98a6b8;stroke-opacity:.7}.node circle{stroke:white;stroke-width:1.5px;cursor:grab}.node text{font-size:12px;pointer-events:none}footer{color:#596579;padding:1rem 0}
</style>
</head>
<body>
<header><h1>D3.js Lab 5 — Force-Directed Graph</h1><p>Student: GULSHAN SINGH · Registration No.: 24SSDS415015</p><nav><a href="index.html">Force graph</a><a href="sankey.html">Sankey diagram</a><a href="treemap.html">Treemap</a></nav></header>
<main><section class="panel"><h2>Network relationships</h2><p>Drag nodes to explore how the sample entities are connected.</p><svg id="graph" role="img" aria-label="Interactive force-directed network graph"></svg></section><footer>Built with D3.js v7. Sample data for educational demonstration.</footer></main>
<script>
const nodes=[{id:"Data"},{id:"Analysis"},{id:"Charts"},{id:"Reports"},{id:"Users"},{id:"Sources"},{id:"Insights"},{id:"Dashboard"}];
const links=[["Data","Analysis"],["Data","Sources"],["Analysis","Charts"],["Analysis","Insights"],["Charts","Dashboard"],["Reports","Dashboard"],["Users","Dashboard"],["Sources","Reports"],["Insights","Reports"],["Users","Insights"]].map(([source,target])=>({source,target}));
const svg=d3.select("#graph"), w=svg.node().clientWidth, h=580; svg.attr("viewBox",[0,0,w,h]);
const simulation=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(105)).force("charge",d3.forceManyBody().strength(-330)).force("center",d3.forceCenter(w/2,h/2)).force("collide",d3.forceCollide(36));
const link=svg.append("g").selectAll("line").data(links).join("line").attr("class","link").attr("stroke-width",2);
const node=svg.append("g").selectAll("g").data(nodes).join("g").attr("class","node").call(d3.drag().on("start",dragstarted).on("drag",dragged).on("end",dragended));
node.append("circle").attr("r",23).attr("fill",(d,i)=>d3.schemeTableau10[i%d3.schemeTableau10.length]);
node.append("text").attr("text-anchor","middle").attr("dy",4).text(d=>d.id).attr("fill","#172033");
simulation.on("tick",()=>{link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);node.attr("transform",d=>`translate(${d.x},${d.y})`)});
function dragstarted(event,d){if(!event.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}
function dragged(event,d){d.fx=event.x;d.fy=event.y}
function dragended(event,d){if(!event.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}
window.addEventListener("resize",()=>location.reload());
</script></body></html>
