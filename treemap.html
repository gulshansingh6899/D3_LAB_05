<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D3.js Lab 5 — Hierarchical Treemap</title><script src="https://d3js.org/d3.v7.min.js"></script><style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f8fb;color:#172033}header{padding:1.25rem 5vw;background:#172033;color:white}nav a{color:#b9dcff;margin-right:1rem}main{max-width:1100px;margin:1.5rem auto;padding:0 1rem}.panel{background:white;border:1px solid #dbe2ea;border-radius:12px;padding:1rem}svg{width:100%;height:580px}.cell rect{stroke:white;stroke-width:2}.cell text{font-size:13px;fill:white;pointer-events:none}</style></head>
<body><header><h1>D3.js Lab 5 — Hierarchical Treemap</h1><p>Student: GULSHAN SINGH · Registration No.: 24SSDS415015</p><nav><a href="index.html">Force graph</a><a href="sankey.html">Sankey diagram</a><a href="treemap.html">Treemap</a></nav></header><main><section class="panel"><h2>Project effort by category</h2><p>Rectangle area represents the relative value of each category and subcategory.</p><svg id="chart" role="img" aria-label="Hierarchical treemap"></svg></section></main>
<script>
const data={name:"Project",children:[{name:"Data",children:[{name:"Collection",value:18},{name:"Cleaning",value:14},{name:"Validation",value:9}]},{name:"Analytics",children:[{name:"Exploration",value:16},{name:"Modeling",value:20},{name:"Evaluation",value:11}]},{name:"Delivery",children:[{name:"Dashboard",value:17},{name:"Documentation",value:8},{name:"Feedback",value:7}]}]};
const svg=d3.select("#chart"),w=svg.node().clientWidth,h=580;svg.attr("viewBox",[0,0,w,h]);
const root=d3.hierarchy(data).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
d3.treemap().size([w,h]).paddingInner(3).paddingTop(22)(root);
const color=d3.scaleOrdinal(root.leaves().map(d=>d.parent.data.name),d3.schemeTableau10);
const cell=svg.selectAll("g").data(root.leaves()).join("g").attr("class","cell").attr("transform",d=>`translate(${d.x0},${d.y0})`);
cell.append("rect").attr("width",d=>Math.max(0,d.x1-d.x0)).attr("height",d=>Math.max(0,d.y1-d.y0)).attr("fill",d=>color(d.parent.data.name)).append("title").text(d=>`${d.ancestors().reverse().map(x=>x.data.name).join(" / ")}: ${d.value}`);
cell.append("text").attr("x",6).attr("y",18).text(d=>d.data.name).each(function(d){const max=Math.max(0,d.x1-d.x0-12);if(this.getComputedTextLength()>max)this.textContent="";});
</script></body></html>
